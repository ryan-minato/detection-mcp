name: Bug
description: Report a reproducible detection-mcp defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove datasets, credentials, personal paths, and identifying logs before submission.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Output of detection-mcp --version
    validations:
      required: true
