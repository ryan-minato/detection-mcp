[project]
name = "detection-mcp"
version = "0.1.0"
description = "Local MCP server for object-detection dataset annotation"
readme = "README.md"
authors = [{ name = "detection-mcp contributors" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.7,<4.0.0",
    "pillow>=11.3.0,<13.0.0",
    "platformdirs>=4.3.8,<5.0.0",
]

[project.scripts]
detection-mcp = "detection_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "ruff>=0.16.3,<0.17.0",
    "rust-just>=1.58.0",
    "ty>=0.0.72,<0.1.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: isolated domain and utility tests",
    "integration: tests spanning multiple project layers",
    "packaging: tests that build or install distributions",
    "docker: tests that require a container runtime",
]

[tool.ty.environment]
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]
exclude = [".agents"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
extend-exclude = [".agents"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
extend-select = ["E", "I", "N", "S", "T10", "T20", "TID", "UP", "W"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*" = ["T201"]
"tests/**/*" = ["S", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
